<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Letrando - Jogo de Palavras</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#14161a">
</head>
<body>

  <div id="app">
    <header>
      <h1>Letrando</h1>
      <div style="display: flex; gap: 6px; align-items: center;">
        <select id="select-categoria" onchange="iniciarJogo(this.value)">
          <option value="geral">Geral</option>
          <option value="tecnologia">Tecnologia</option>
          <option value="futebol">Futebol</option>
          <option value="geografia">Geografia</option>
        </select>
        <button class="btn-icon" onclick="iniciarJogo(categoriaAtual)" title="Nova Partida">🔄</button>
        <button class="btn-icon" onclick="gerarGridEmojis()" title="Compartilhar">🚀</button>
      </div>
    </header>

    <main>
      <div id="board">
        <div class="row">
          <div class="cell" id="cell-0-0"></div><div class="cell" id="cell-0-1"></div><div class="cell" id="cell-0-2"></div><div class="cell" id="cell-0-3"></div><div class="cell" id="cell-0-4"></div>
        </div>
        <div class="row">
          <div class="cell" id="cell-1-0"></div><div class="cell" id="cell-1-1"></div><div class="cell" id="cell-1-2"></div><div class="cell" id="cell-1-3"></div><div class="cell" id="cell-1-4"></div>
        </div>
        <div class="row">
          <div class="cell" id="cell-2-0"></div><div class="cell" id="cell-2-1"></div><div class="cell" id="cell-2-2"></div><div class="cell" id="cell-2-3"></div><div class="cell" id="cell-2-4"></div>
        </div>
        <div class="row">
          <div class="cell" id="cell-3-0"></div><div class="cell" id="cell-3-1"></div><div class="cell" id="cell-3-2"></div><div class="cell" id="cell-3-3"></div><div class="cell" id="cell-3-4"></div>
        </div>
        <div class="row">
          <div class="cell" id="cell-4-0"></div><div class="cell" id="cell-4-1"></div><div class="cell" id="cell-4-2"></div><div class="cell" id="cell-4-3"></div><div class="cell" id="cell-4-4"></div>
        </div>
        <div class="row">
          <div class="cell" id="cell-5-0"></div><div class="cell" id="cell-5-1"></div><div class="cell" id="cell-5-2"></div><div class="cell" id="cell-5-3"></div><div class="cell" id="cell-5-4"></div>
        </div>
      </div>
    </main>

    <div id="keyboard">
      <div class="krow">
        <button class="key" data-key="Q" onclick="tratarTecla('Q')">Q</button>
        <button class="key" data-key="W" onclick="tratarTecla('W')">W</button>
        <button class="key" data-key="E" onclick="tratarTecla('E')">E</button>
        <button class="key" data-key="R" onclick="tratarTecla('R')">R</button>
        <button class="key" data-key="T" onclick="tratarTecla('T')">T</button>
        <button class="key" data-key="Y" onclick="tratarTecla('Y')">Y</button>
        <button class="key" data-key="U" onclick="tratarTecla('U')">U</button>
        <button class="key" data-key="I" onclick="tratarTecla('I')">I</button>
        <button class="key" data-key="O" onclick="tratarTecla('O')">O</button>
        <button class="key" data-key="P" onclick="tratarTecla('P')">P</button>
      </div>
      <div class="krow">
        <button class="key" data-key="A" onclick="tratarTecla('A')">A</button>
        <button class="key" data-key="S" onclick="tratarTecla('S')">S</button>
        <button class="key" data-key="D" onclick="tratarTecla('D')">D</button>
        <button class="key" data-key="F" onclick="tratarTecla('F')">F</button>
        <button class="key" data-key="G" onclick="tratarTecla('G')">G</button>
        <button class="key" data-key="H" onclick="tratarTecla('H')">H</button>
        <button class="key" data-key="J" onclick="tratarTecla('J')">J</button>
        <button class="key" data-key="K" onclick="tratarTecla('K')">K</button>
        <button class="key" data-key="L" onclick="tratarTecla('L')">L</button>
      </div>
      <div class="krow">
        <button class="key wide" onclick="submeterTentativa()">ENTER</button>
        <button class="key" data-key="Z" onclick="tratarTecla('Z')">Z</button>
        <button class="key" data-key="X" onclick="tratarTecla('X')">X</button>
        <button class="key" data-key="C" onclick="tratarTecla('C')">C</button>
        <button class="key" data-key="V" onclick="tratarTecla('V')">V</button>
        <button class="key" data-key="B" onclick="tratarTecla('B')">B</button>
        <button class="key" data-key="N" onclick="tratarTecla('N')">N</button>
        <button class="key" data-key="M" onclick="tratarTecla('M')">M</button>
        <button class="key wide" onclick="deletarLetra()">⌫</button>
      </div>
    </div>
  </div>

  <!-- Modal de Fim de Jogo -->
  <div id="modal-fim" class="modal-overlay">
    <div class="modal-content">
      <h2 id="modal-titulo">Parabéns! 🎉</h2>
      <p id="modal-mensagem">Você acertou em 3 tentativas!</p>
      <div class="modal-buttons">
        <button class="btn-primary" onclick="jogarNovamente()">Jogar Outra Partida 🔄</button>
        <button class="btn-secondary" onclick="gerarGridEmojis()">Compartilhar Resultado 🚀</button>
      </div>
    </div>
  </div>

  <script src="words.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
    }

    function tratarTecla(letra) {
      if (colunaAtual < 5 && !jogoFinalizado) {
        tentativas[linhaAtual][colunaAtual] = letra;
        const cell = document.getElementById(`cell-${linhaAtual}-${colunaAtual}`);
        if (cell) {
          cell.textContent = letra;
          cell.classList.add('filled');
        }
        colunaAtual++;
      }
    }

    function deletarLetra() {
      if (colunaAtual > 0 && !jogoFinalizado) {
        colunaAtual--;
        tentativas[linhaAtual][colunaAtual] = '';
        const cell = document.getElementById(`cell-${linhaAtual}-${colunaAtual}`);
        if (cell) {
          cell.textContent = '';
          cell.classList.remove('filled');
        }
      }
    }

    document.addEventListener('keydown', (e) => {
      if (jogoFinalizado) return;
      const key = e.key.toUpperCase();
      if (key === 'ENTER') submeterTentativa();
      else if (key === 'BACKSPACE') deletarLetra();
      else if (/^[A-Z]$/.test(key)) tratarTecla(key);
    });
  </script>
</body>
</html>
